# Put one commit live on www.shvft20.org, by hand: Actions > Promote to
# production > Run workflow. Refuses any commit that didn't pass every check
# and reach staging first.
#
# It publishes the way staging does: the site is pushed to the gh-pages
# branch, which GitHub Pages serves (Settings, Pages: "Deploy from a branch",
# gh-pages, / (root)). GitHub's deploy-pages action hung twice on
# 4 November 2026 without publishing; the branch method hasn't failed.
name: Promote to production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote (leave empty for the latest on main)
        required: false
permissions:
  contents: write
  actions: read
concurrency: { group: pages-production, cancel-in-progress: false }
jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.shvft20.org/portal/
    steps:
      - name: Which commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ inputs.sha }}"
          [ -n "$sha" ] || sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?head_sha=$sha&status=success&event=push" --jq '.total_count')
          if [ "$ok" = "0" ]; then echo "::error::$sha hasn't passed its checks and reached staging. Push it to main first."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
      - name: Build the site
        run: mkdir -p /tmp/site && rsync -a --exclude .git --exclude .github --exclude node_modules --exclude CNAME ./ /tmp/site/
      - name: Publish to www.shvft20.org
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/site
          cname: www.shvft20.org
          full_commit_message: Production build of ${{ github.repository }}@${{ steps.pick.outputs.sha }}
