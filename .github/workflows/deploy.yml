# Every push: run the portal's JavaScript tests, and rebuild the portal's
# database from its private repository (T360impact/consortium-portal-db)
# and run every SQL access test against it. Pushes to main that pass deploy
# to staging (https://staging.shvft20.org, its own Supabase project). The
# live site changes only when someone runs "Promote to production"
# (promote.yml) for a commit that reached staging.
#
# Secrets: PORTAL_DB_DEPLOY_KEY (read-only deploy key on
# consortium-portal-db) and STAGING_SITE_DEPLOY_KEY (write deploy key on
# shvft20-portal-staging). Without them the jobs fail and nothing deploys.
name: Test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portal:
    name: Portal JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the checking tools
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Type check (tsc --checkJs)
        run: npm run typecheck
      - name: Every portal script parses
        run: for f in $(find portal site.js -name '*.js' -not -path '*/vendor/*'); do node --check --input-type=module < "$f" || { echo "Syntax error in $f"; exit 1; }; done
      - name: Portal tests
        run: node --test 'portal/tests/*.test.mjs'
  database:
    name: Database rebuild and access tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the portal database (private)
        uses: actions/checkout@v4
        with:
          repository: T360impact/consortium-portal-db
          ssh-key: ${{ secrets.PORTAL_DB_DEPLOY_KEY }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase with every migration applied
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit,edge-runtime
      - name: Compare with production's shape
        run: scripts/fingerprint.sh
      - name: Access tests
        if: success() || failure()
        run: scripts/run-sql-tests.sh
  staging:
    name: Deploy to staging
    needs: [portal, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: staging-site, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Build the staging copy
        run: |
          mkdir -p /tmp/site && rsync -a --exclude .git --exclude .github --exclude CNAME ./ /tmp/site/
          cat > /tmp/site/portal/config.js <<'JS'
          // STAGING. Written by the deploy workflow: the staging Supabase project.
          export const SUPABASE_URL = 'https://xsefiubsnfrtxlcbbtki.supabase.co';
          export const SUPABASE_KEY = 'sb_publishable_YEBBC-jA8eOTQIT1g3l0dg_fCWhZm7D';
          export const ENVIRONMENT = 'staging';
          JS
          # The Content Security Policy names the project: staging's instead.
          sed -i 's/wxwrnjoyerudbhigjxts/xsefiubsnfrtxlcbbtki/g' /tmp/site/portal/index.html
          printf 'User-agent: *\nDisallow: /\n' > /tmp/site/robots.txt
          for f in $(find /tmp/site -name '*.html'); do sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' "$f"; done
      - name: Publish to the staging site
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_SITE_DEPLOY_KEY }}
          external_repository: T360impact/shvft20-portal-staging
          publish_branch: gh-pages
          publish_dir: /tmp/site
          cname: staging.shvft20.org
          full_commit_message: Staging build of ${{ github.repository }}@${{ github.sha }}
