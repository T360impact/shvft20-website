# Every push: run the portal's JavaScript tests, and rebuild the portal's
# database from its private repository (T360impact/consortium-portal-db)
# and run every SQL access test against it. The site deploys to GitHub Pages
# only from main, and only if every check passed.
#
# Reading the private repository needs the PORTAL_DB_DEPLOY_KEY secret (a
# read-only deploy key on that repository). Without it the database job
# fails and nothing deploys.
name: Test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portal:
    name: Portal JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Every portal script parses
        run: for f in $(find portal site.js -name '*.js' -not -path '*/vendor/*'); do node --check --input-type=module < "$f" || { echo "Syntax error in $f"; exit 1; }; done
      - name: Portal tests
        run: node --test 'portal/tests/*.test.mjs'
  database:
    name: Database rebuild and access tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the portal database (private)
        uses: actions/checkout@v4
        with:
          repository: T360impact/consortium-portal-db
          ssh-key: ${{ secrets.PORTAL_DB_DEPLOY_KEY }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase with every migration applied
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit,edge-runtime
      - name: Compare with production's shape
        run: scripts/fingerprint.sh
      - name: Access tests
        if: success() || failure()
        run: scripts/run-sql-tests.sh
  deploy:
    name: Deploy to GitHub Pages
    needs: [portal, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
